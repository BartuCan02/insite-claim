[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
linkColor = "#0071e3"
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
headingFontWeights = 600
baseRadius = "12px"
buttonRadius = "980px"
borderColor = "#d2d2d7"
showWidgetBorder = true
chartCategoricalColors = ["#0071e3", "#ff9f0a", "#34c759", "#5856d6", "#ff2d55", "#8e8e93"]

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
headless = true
address = "localhost"
runOnSave = false

[browser]
gatherUsageStats = false
